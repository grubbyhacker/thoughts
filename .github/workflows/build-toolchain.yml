name: Build CI Toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/images/thoughts-build/**
      - .github/workflows/build-toolchain.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/thoughts-build
  HUGO_VERSION: 0.163.3
  PANDOC_VERSION: "3.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .github/images/thoughts-build
          platforms: linux/amd64
          push: true
          build-args: |
            HUGO_VERSION=${{ env.HUGO_VERSION }}
            PANDOC_VERSION=${{ env.PANDOC_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:ci
            ${{ env.IMAGE_NAME }}:hugo-${{ env.HUGO_VERSION }}
