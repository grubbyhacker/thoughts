name: Publish agent image

on:
  push:
    branches:
      - main
    paths:
      - .gitmodules
      - mise.toml
      - package-lock.json
      - pnpm-lock.yaml
      - yarn.lock
      - bun.lock
      - bun.lockb
      - uv.lock
      - poetry.lock
      - Pipfile.lock
      - go.sum
      - Cargo.lock
      - Gemfile.lock
      - requirements*.txt
      - themes/PaperMod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: grubbyhacker/agent-workflows/.github/workflows/publish-agent-image.yml@af21f03c4b0d0eeba42a1ffd17b384ab71506e9e
