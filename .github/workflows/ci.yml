name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TOOLCHAIN_IMAGE: ghcr.io/grubbyhacker/thoughts-build:ci
  HUGO_VERSION: 0.163.3
  PANDOC_VERSION: "3.10"

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare toolchain image
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^\.github/images/thoughts-build/|^\.github/workflows/build-toolchain\.yml$'; then
            docker build --build-arg HUGO_VERSION="$HUGO_VERSION" --build-arg PANDOC_VERSION="$PANDOC_VERSION" -t "$TOOLCHAIN_IMAGE" .github/images/thoughts-build
          else
            docker pull "$TOOLCHAIN_IMAGE" || docker build --build-arg HUGO_VERSION="$HUGO_VERSION" --build-arg PANDOC_VERSION="$PANDOC_VERSION" -t "$TOOLCHAIN_IMAGE" .github/images/thoughts-build
          fi

      - name: Validate generated assets
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            bash -lc 'git config --global --add safe.directory /workspace && scripts/validate-site.sh'
