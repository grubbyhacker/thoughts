name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 0.163.3
          extended: true

      - name: Build
        run: hugo --minify --noBuildLock

      - name: Verify Markdown alternate
        run: |
          test -f public/writing/autotrack/index.md
          cmp content/writing/autotrack/index.md public/writing/autotrack/index.md
          grep -Fq '<link rel=alternate type=text/markdown href=/writing/autotrack/index.md>' public/writing/autotrack/index.html
