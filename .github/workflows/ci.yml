name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v3

      - name: Validate site
        run: mise run validate
