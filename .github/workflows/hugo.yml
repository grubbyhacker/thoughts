name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TOOLCHAIN_IMAGE: ghcr.io/grubbyhacker/thoughts-build:ci
  HUGO_VERSION: 0.163.3
  PANDOC_VERSION: "3.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare toolchain image
        run: |
          if git diff --name-only HEAD^ HEAD | grep -E '^\.github/images/thoughts-build/|^\.github/workflows/build-toolchain\.yml$'; then
            docker build --build-arg HUGO_VERSION="$HUGO_VERSION" --build-arg PANDOC_VERSION="$PANDOC_VERSION" -t "$TOOLCHAIN_IMAGE" .github/images/thoughts-build
          else
            docker pull "$TOOLCHAIN_IMAGE" || docker build --build-arg HUGO_VERSION="$HUGO_VERSION" --build-arg PANDOC_VERSION="$PANDOC_VERSION" -t "$TOOLCHAIN_IMAGE" .github/images/thoughts-build
          fi

      - name: Generate PDFs
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            bash -lc 'git config --global --add safe.directory /workspace && make pdf'

      - name: Build
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -w /workspace \
            "$TOOLCHAIN_IMAGE" \
            bash -lc 'git config --global --add safe.directory /workspace && hugo --minify'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
