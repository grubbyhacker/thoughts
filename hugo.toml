baseURL = "http://fleig.us/"
languageCode = "en-us"
title = "Roger Fleig"
theme = "PaperMod"

[module]
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = ".generated/static"
    target = "static"

[outputFormats]
  [outputFormats.markdown]
    notAlternative = true

[[cascade]]
  outputs = ["html", "markdown"]
  [cascade.target]
    path = "/writing/**"

[params]
  author = "Roger Fleig"
  description = "Long-form essays on software engineering and AI."
  ShowToc = true
  TocOpen = true
  ShowBreadCrumbs = true
  ShowReadingTime = true
  ShowPostNavLinks = true

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/rogerfleig/"

[[params.socialIcons]]
  name = "substack"
  url = "https://rogerfleig.substack.com/"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/grubbyhacker"

[menu]
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 0

  [[menu.main]]
    name = "Writing"
    url = "/writing/"
    weight = 1

  [[menu.main]]
    name = "Disclaimer"
    url = "/disclaimer/"
    weight = 2

  [[menu.main]]
    name = "License"
    url = "/license/"
    weight = 3
